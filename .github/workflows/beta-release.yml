name: Build and publish Windows release candidate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lampik-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run bilingual command parser smoke tests
        shell: pwsh
        run: |
          dotnet run --project tests/Lampik.ParserTests/Lampik.ParserTests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and publish Windows x64 executable
        shell: pwsh
        run: |
          dotnet publish Lampik/Lampik.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None --output release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path release/Lampik.exe)) { throw 'Lampik.exe was not produced' }

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build bilingual installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $compiler installer\Lampik.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path release-installer/Lampik-Setup-1.0.0-rc.1-win-x64.exe)) {
            throw 'Setup EXE was not produced'
          }

      - name: Test upgrade, single instance and uninstall
        shell: pwsh
        run: ./tests/Test-Installer.ps1

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lampik-v1.0.0-rc.1-win-x64
          path: |
            release/Lampik.exe
            release-installer/Lampik-Setup-1.0.0-rc.1-win-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified release candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.0-rc.1'
          $assets = @(
            'release/Lampik.exe',
            'release-installer/Lampik-Setup-1.0.0-rc.1-win-x64.exe'
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists" }
          gh release create $tag @assets --prerelease --title "Lampik $tag" --notes-file RELEASE_NOTES.md --target "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
